<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- TrivaSite "modular tile": three service modules (build, intelligence, foundation) whose gaps form a T, joined by an AI/integration node. -->
  <defs>
    <clipPath id="tile"><rect x="3" y="3" width="42" height="42" rx="13" /></clipPath>
    <linearGradient id="build" x1="3" y1="3" x2="45" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#4A86FF" /><stop offset="1" stop-color="#235CE1" /></linearGradient>
    <linearGradient id="intelligence" x1="3" y1="20" x2="22" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#2A63E8" /><stop offset="1" stop-color="#1C46B0" /></linearGradient>
    <linearGradient id="foundation" x1="26" y1="20" x2="45" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#1F4BB8" /><stop offset="1" stop-color="#14306E" /></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="48" height="16.5" fill="url(#build)" />
    <rect y="20" width="22.25" height="28" fill="url(#intelligence)" />
    <rect x="25.75" y="20" width="22.25" height="28" fill="url(#foundation)" />
  </g>
  <circle cx="24" cy="18.25" r="3.6" fill="#fff" />
  <circle cx="24" cy="18.25" r="2.2" fill="#3FD0C9" />
</svg>
